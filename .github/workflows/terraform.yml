name: Terraform

# PR            -> plan every environment (read-only role); plan shown in job summary
# push to main  -> plan, then apply that exact plan after approval on infra-<env>
#
# Add an environment: create envs/<env>, add it to bootstrap `environments`,
# re-apply bootstrap, then add a job below.

on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/terraform*.yml"]
  push:
    branches: [main]
    paths: ["envs/**", "modules/**", ".github/workflows/terraform*.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prod:
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: prod
    secrets: inherit
